<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Marketplace</title>
<style>
  :root {
    --bg: #fafaf8; --surface: #ffffff; --text: #1c1c1a; --muted: #55554f; --border: #d4d4cc;
    --focus: #1a56c4;
    --sample-bg: #ececea; --sample-fg: #3d3d39;
    --nc-bg: #fdf0d0; --nc-fg: #6b4400;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --surface: #1f1f1c; --text: #ecece8; --muted: #b0b0a8; --border: #3a3a35;
      --focus: #7aa8ff;
      --sample-bg: #34342f; --sample-fg: #dcdcd6;
      --nc-bg: #4a3500; --nc-fg: #ffd98a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.75rem; margin: 0 0 8px; }
  h2 { font-size: 1.15rem; margin: 24px 0 4px; }
  p { margin: 0 0 12px; }
  .lead { color: var(--muted); margin-bottom: 24px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  h1:focus { outline: none; }

  .grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card { display: flex; flex-direction: column; gap: 8px; height: 100%; padding: 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    color: inherit; text-decoration: none; }
  .card:hover { border-color: var(--muted); }
  .card h2 { margin: 0; font-size: 1.15rem; }
  .card p { margin: 0; color: var(--muted); flex: 1; }

  .badge { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
    padding: 2px 10px; border-radius: 999px; font-size: .875rem; font-weight: 600; }
  .badge.sample { background: var(--sample-bg); color: var(--sample-fg); }
  .badge.not_connected { background: var(--nc-bg); color: var(--nc-fg); }

  .back { display: inline-block; margin-bottom: 16px; color: var(--focus); }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 8px; }
  .head h1 { margin: 0; }
  .note { padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
</style>
</head>
<body>
<main id="app"></main>

<script>
"use strict";
/* Catalog source — in-code, behind list()/get(id) so storage can change later (Architecture §4.2). */
const ENTRIES = [
  { id: "coding-agent", name: "Whatsapp Agent", kind: "local",
    summary: "Exists locally; integration is next.",
    description: "The Coding Agent is a local agent: it exists on the participant's machine. The marketplace is not connected to it yet. Connecting it is the next milestone.",
    now: "Read about this agent. Connecting it to the marketplace comes in the next milestone." },
  { id: "jira-task-advisor", name: "Jira Task Advisor", kind: "sample",
    summary: "Sample: will recommend actions and test cases for Jira tasks.",
    description: "The Jira Task Advisor will read tasks from Jira and recommend courses of action and test cases. This entry is a sample that shows what the marketplace will hold. It does not run yet.",
    now: "Read about this agent. It is a sample and does not run yet." },
  { id: "task-intermediary", name: "Task Intermediary", kind: "sample",
    summary: "Sample: will turn WhatsApp tasks into assigned work.",
    description: "The Task Intermediary will sit between a department manager and development team leads. It will read tasks from WhatsApp, document them, and assign them to specific people on a designated platform. This entry is a sample that shows what the marketplace will hold. It does not run yet.",
    now: "Read about this agent. It is a sample and does not run yet." }
];
const catalog = {
  list: () => ENTRIES,
  get: id => ENTRIES.find(e => e.id === id) || null
};

/* Adapters — static in this milestone; no agent is contacted or run. */
const STATUS = {
  sample: { label: "Sample", marker: "◇",
    message: "Example entry showing what the marketplace will hold. It doesn't run yet." },
  not_connected: { label: "Not connected", marker: "◐",
    message: "Exists on this machine, but the marketplace isn't connected to it yet." }
};
const statusFor = entry => entry.kind === "sample" ? "sample" : "not_connected";

const app = document.getElementById("app");
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  kids.forEach(k => n.append(k));
  return n;
};
const badge = state => {
  const s = STATUS[state];
  const b = el("span", { class: "badge " + state });
  b.append(el("span", { "aria-hidden": "true" }, s.marker), s.label);
  return b;
};

let catalogScroll = 0;
let lastOpened = null;

function showCatalog() {
  document.title = "Agent Marketplace";
  const grid = el("div", { class: "grid" });
  for (const e of catalog.list()) {
    const a = el("a", { class: "card", href: "#/agents/" + e.id, "data-id": e.id },
      el("h2", {}, e.name), el("p", {}, e.summary), badge(statusFor(e)));
    a.addEventListener("click", () => { catalogScroll = window.scrollY; lastOpened = e.id; });
    grid.append(a);
  }
  app.replaceChildren(
    el("h1", { tabindex: "-1" }, "Agent Marketplace"),
    el("p", { class: "lead" }, "Agents from the course. Some are samples while the marketplace is being built."),
    grid);
  window.scrollTo(0, catalogScroll);
  const card = lastOpened && app.querySelector('[data-id="' + lastOpened + '"]');
  if (card) card.focus({ preventScroll: true });
}

function backLink() {
  const a = el("a", { class: "back", href: "#/" }, "← All agents");
  return a;
}

function showDetail(entry) {
  document.title = entry.name + " — Agent Marketplace";
  const state = statusFor(entry);
  const h1 = el("h1", { tabindex: "-1" }, entry.name);
  app.replaceChildren(
    backLink(),
    el("div", { class: "head" }, h1, badge(state)),
    el("p", {}, STATUS[state].message),
    el("h2", {}, "About"), el("p", {}, entry.description),
    el("h2", {}, "What you can do now"), el("p", {}, entry.now));
  window.scrollTo(0, 0);
  h1.focus();
}

function showNotFound() {
  document.title = "Agent not found — Agent Marketplace";
  const h1 = el("h1", { tabindex: "-1" }, "Agent not found");
  app.replaceChildren(backLink(), h1, el("p", {}, "There is no agent at this address."));
  window.scrollTo(0, 0);
  h1.focus();
}

function route() {
  const hash = location.hash.replace(/^#/, "") || "/";
  const m = hash.match(/^\/agents\/([^/]+)$/);
  if (hash === "/") return showCatalog();
  if (m) {
    const e = catalog.get(decodeURIComponent(m[1]));
    return e ? showDetail(e) : showNotFound();
  }
  showNotFound();
}

if ("scrollRestoration" in history) history.scrollRestoration = "manual";
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
